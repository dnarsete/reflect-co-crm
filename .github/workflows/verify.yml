name: Verify Reflect CRM

# Runs on every push AND every pull request against main.
# Two layers of protection:
#   1. syntax-check — parses every JS file BEFORE it can reach production.
#      If this fails, the deploy is broken. GitHub emails you automatically
#      on workflow failure (Settings → Notifications → Actions).
#   2. smoke-test — after GitHub Pages redeploys, loads the live CRM in a
#      headless Chrome and checks the console. Fails if app.js didn't parse
#      OR if any console error fires on load.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Parse all JS files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check app.js
        run: node --check app.js

      - name: Syntax-check sw.js
        run: node --check sw.js

      - name: Syntax-check config.js
        run: node --check config.js

  smoke-test:
    name: Load live site in headless Chrome
    needs: syntax-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null
          npm install --save-dev playwright@1 >/dev/null
          npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages to serve this commit
        run: |
          LOCAL_VER=$(grep -oE "reflect-crm-v[0-9]+" sw.js | head -1)
          echo "Local SW version: $LOCAL_VER"
          for i in $(seq 1 40); do
            DEPLOYED=$(curl -s "https://dnarsete.github.io/reflect-co-crm/sw.js?ts=$(date +%s%N)" | grep -oE "reflect-crm-v[0-9]+" | head -1)
            echo "Attempt $i: deployed=$DEPLOYED"
            if [ "$DEPLOYED" = "$LOCAL_VER" ]; then
              echo "✅ Live"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Pages did not serve $LOCAL_VER within 400s"
          exit 1

      - name: Smoke test — CRM loads without console errors
        run: |
          cat > smoke.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: ' + String(e.message || e)));
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push('console: ' + msg.text());
            });
            const url = 'https://dnarsete.github.io/reflect-co-crm/?smoke=' + Date.now();
            console.log('Loading', url);
            await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 });
            await page.waitForTimeout(3000);

            const wired = await page.evaluate(() => ({
              auth:      typeof window.auth === 'object',
              login:     typeof (window.auth && window.auth.login),
              magic:     typeof (window.auth && window.auth.magicLink),
              accounts:  typeof window.accounts === 'object',
              orders:    typeof window.orders === 'object',
              boot:      typeof window.boot === 'function'
            }));

            const critical = errors.filter(e =>
              !e.includes('frame-ancestors') &&
              !e.includes('unsafe-eval')
            );

            console.log('Wired:', JSON.stringify(wired));
            console.log('Critical errors:', critical.length);
            critical.forEach(e => console.log('  ✖ ' + e));

            const bad = !wired.auth || wired.login !== 'function' || wired.magic !== 'function' || critical.length > 0;
            await browser.close();
            if (bad) {
              console.log('❌ Smoke test FAILED — the CRM is broken in production.');
              process.exit(1);
            }
            console.log('✅ Smoke test PASSED — CRM loads and every auth handler is wired.');
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node smoke.js
