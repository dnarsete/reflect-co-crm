<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Reflect Co — download</title>
<style>
  body {
    margin: 0; padding: 40px 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0e1a2e; color: #f0f4fa;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .box {
    max-width: 480px; text-align: center;
    background: #1a2942; padding: 32px; border-radius: 12px;
    border: 1px solid #2a3a52;
  }
  h1 { margin: 0 0 12px; font-size: 20px; }
  p { margin: 8px 0; font-size: 14px; color: #a5b3c8; }
  .spinner {
    display: inline-block; width: 32px; height: 32px;
    border: 3px solid #2a3a52; border-top-color: #d4652f;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 12px 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { color: #ff8a8a; }
  a.btn {
    display: inline-block; margin-top: 12px; padding: 10px 20px;
    background: #d4652f; color: white; text-decoration: none; border-radius: 8px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="box">
  <h1>The Reflect Co</h1>
  <div id="status">
    <div class="spinner"></div>
    <p>Preparing your download…</p>
  </div>
</div>

<!-- Supabase JS from a CDN that's already on the CRM's CSP allowlist.
     Kept small: just what we need to call the resolver RPC. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async () => {
  const status = document.getElementById('status');
  const show = (html) => { status.innerHTML = html; };
  const showErr = (msg) => show(`<p class="err">⚠ ${msg}</p><p><a href="https://dnarsete.github.io/reflect-co-crm/" class="btn">Back to home</a></p>`);

  /* Short code from the hash fragment (#abc123) OR the query (?c=abc123).
     Hash is preferred because it never gets sent to the server, but
     query works as a fallback. */
  const hash = (window.location.hash || '').replace(/^#/, '');
  const qs   = new URLSearchParams(window.location.search).get('c') || '';
  const code = (hash || qs).trim();

  if (!code || !/^[a-z0-9]{4,16}$/i.test(code)) {
    showErr('Invalid or missing link code.');
    return;
  }

  /* Fetch Supabase config from the sibling CRM app so we don't hard-code
     credentials in two places. config.js sets window.REFLECT_CONFIG. */
  try {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = '../config.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('config load failed'));
      document.head.appendChild(s);
    });
  } catch (e) {
    showErr('Config load failed. Please try again.');
    return;
  }
  const cfg = window.REFLECT_CONFIG || {};
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_KEY) {
    showErr('Config incomplete. Please try again.');
    return;
  }

  const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);

  /* Ask the resolver for the underlying storage path, then generate a
     fresh signed URL. Note: resolve_short_link both returns the path
     AND increments the click counter. */
  let bucket, path, downloadFilename;
  try {
    const r = await sb.rpc('resolve_short_link', { p_code: code });
    if (r.error) throw r.error;
    if (!r.data || !r.data.length) throw new Error('Link not found or expired.');
    ({ bucket, storage_path: path, download_filename: downloadFilename } = r.data[0]);
  } catch (e) {
    showErr('Link not found or expired.');
    return;
  }

  /* Build the download URL. Uses the bucket's public URL (materials is
     public) and appends ?download= to force a file save with the
     original filename rather than opening in-browser for PDFs/videos. */
  let target;
  try {
    const pub = sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
    target = downloadFilename
      ? `${pub}?download=${encodeURIComponent(downloadFilename)}`
      : pub;
  } catch (e) {
    showErr('Could not prepare download. Please try again.');
    return;
  }

  /* Redirect right into the file. Uses replace() so Back button skips
     this loading page and returns to whatever the user was on before. */
  window.location.replace(target);

  /* Fallback message in case the redirect doesn't fire in some weird
     browser — shows a clickable link. */
  setTimeout(() => {
    show(`<p>If the download didn't start, <a href="${target}" class="btn">tap here</a>.</p>`);
  }, 2500);
})();
</script>
</body>
</html>
